name: Builds, tests & co

on:
  - push
  - pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: 5
      - run: opam install . --deps-only
      - run: opam exec -- dune build

  lint-fmt:
    name: Lint fmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: 5
      - uses: ocaml/setup-ocaml/lint-fmt@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0

  lint-opam:
    name: Lint opam
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: 5
      - uses: ocaml/setup-ocaml/lint-opam@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0

  lint-taplo:
    name: Lint taplo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set-up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
      - run: brew install taplo
      - run: taplo lint
